name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version and tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json must define a version"
            exit 1
          fi

          TAG="v$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build

      - name: Name binary
        id: binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="weather-windows-x64.exe"
            SOURCE="weather.exe"
          else
            ARCH=$(uname -m)
            case "$ARCH" in
              arm64|aarch64) ARCH="arm64" ;;
              x86_64|amd64) ARCH="x64" ;;
              *) echo "Unsupported runner architecture: $ARCH"; exit 1 ;;
            esac

            if [ "$RUNNER_OS" = "macOS" ]; then
              ASSET="weather-macos-$ARCH"
            else
              ASSET="weather-linux-$ARCH"
            fi
            SOURCE="weather"
          fi

          mv "$SOURCE" "$ASSET"
          echo "name=$ASSET" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.binary.outputs.name }}
          path: ${{ steps.binary.outputs.name }}
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
